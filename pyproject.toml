[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-qwen"
version = "0.1.0"
description = "Locally fine-tuned Qwen goals for the official MicroDuck MuJoCo simulator"
requires-python = ">=3.12,<3.13"
dependencies = ["mlx-lm[train]==0.32.0", "mlx==0.32.3", "transformers==5.19.0"]

[project.scripts]
duck-language = "microduck_qwen.cli:main"

[tool.setuptools.packages.find]
include = ["microduck_qwen*"]

[tool.setuptools.package-data]
microduck_qwen = ["arena.json"]
